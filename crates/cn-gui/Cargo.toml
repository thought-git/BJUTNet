[package]
name = "cn-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "BJUTNet"
path = "src/main.rs"

[dependencies]
cn-core = { path = "../cn-core" }
# GUI 依赖必须精确 pin 到离线缓存里的版本（M0 坑 4）
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts"] }
serde_json = "1"
ico = "0.5"
chrono = "0.4"

[build-dependencies]
embed-resource = "3"
