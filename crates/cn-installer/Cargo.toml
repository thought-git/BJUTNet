[package]
name = "cn-installer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "BJUTNetSetup"
path = "src/main.rs"

[dependencies]
cn-core = { path = "../cn-core" }
cn-common = { path = "../cn-common" }
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts"] }
serde_json = "1"
ico = "0.5"
chrono = "0.4"

[build-dependencies]
embed-resource = "3"
